<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kit EstéticIA · Las apps de la consulta de medicina estética</title>
<meta name="description" content="Kit EstéticIA: ocho apps para cada momento de la consulta de medicina estética, de la primera visita a la revisión. Máster de Medicina Estética Integral y Antienvejecimiento, UMH.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --piel:#F2D7C9;--piel2:#E9C3B0;--tinta:#1D1A2E;--gris:#5E5470;--rotu:#5B2A86;--rotu2:#7B45AD;
  --urg:#B3203A;--sinia:#0B7268;--papel:#FFFFFF;--suave:#F7F4F8;--linea:#E3DCE8;
  --disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--txt:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;font-family:var(--txt);font-size:17px;line-height:1.6;color:var(--tinta);background:var(--papel);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--rotu)}
:focus-visible{outline:3px solid var(--rotu);outline-offset:3px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}

/* barra */
.top{position:sticky;top:0;z-index:20;background:rgba(242,215,201,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(91,42,134,.15);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.marca{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.01em;text-decoration:none;color:var(--tinta);display:flex;align-items:center;gap:10px}
.marca svg{width:28px;height:28px}
.langs{display:flex;gap:4px}
.langs button{font:600 14px var(--txt);border:1px solid transparent;background:none;color:var(--tinta);padding:6px 10px;border-radius:20px;cursor:pointer;min-height:36px}
.langs button[aria-pressed=true]{background:var(--tinta);color:#fff}

/* portada */
.hero{background:var(--piel);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;padding-top:56px;padding-bottom:40px}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(40px,6.4vw,82px);line-height:.98;letter-spacing:-.035em;margin:0 0 22px;max-width:12ch}
.hero .sub{font-size:clamp(17px,1.6vw,20px);max-width:36ch;margin:0 0 28px;color:#3A3048}
.hero .meta{font-size:14px;color:#4A3F5A;margin:18px 0 0;max-width:46ch}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--rotu);color:#fff;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:999px;min-height:48px}
.cta:hover{background:#4A2070}
.cara{width:100%;max-width:470px;justify-self:center;display:block}
.cara .traz{fill:none;stroke:var(--rotu);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cara .fina{stroke-width:1.6;stroke-dasharray:6 7}
.cara .pto{fill:var(--rotu)}
.cara .riesgo{fill:url(#rayado);stroke:var(--urg);stroke-width:1.6}
.cara .contorno{fill:none;stroke:#B98A73;stroke-width:2}
.cara text{font:600 12px var(--txt);fill:var(--rotu)}
.cara .anota{fill:var(--urg)}
@media (prefers-reduced-motion:no-preference){
  .cara .dib{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:trazo 1.4s cubic-bezier(.6,.1,.3,1) forwards;animation-delay:var(--d,0s)}
  .cara .fina.dib{stroke-dasharray:6 7;stroke-dashoffset:0;opacity:0;animation:aparece .5s forwards;animation-delay:var(--d,0s)}
  .cara .pto,.cara .riesgo,.cara text{opacity:0;animation:aparece .4s forwards;animation-delay:var(--d,1.6s)}
  @keyframes trazo{to{stroke-dashoffset:0}}
  @keyframes aparece{to{opacity:1}}
}

/* secciones */
section{padding:84px 0}
.h2{font-family:var(--disp);font-weight:800;font-size:clamp(30px,4vw,48px);line-height:1.05;letter-spacing:-.025em;margin:0 0 14px;max-width:22ch}
.lead{font-size:19px;color:var(--gris);max-width:62ch;margin:0 0 40px}

/* recorrido */
.ruta{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:0;padding:0;list-style:none}
.ruta::before{content:"";position:absolute;left:4%;right:4%;top:27px;height:3px;background:repeating-linear-gradient(90deg,var(--rotu) 0 10px,transparent 10px 18px)}
.paso{position:relative;text-align:left}
.paso button{all:unset;cursor:pointer;display:block;width:100%;padding:0 4px 8px;border-radius:10px}
.paso .num{position:relative;z-index:1;display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:#fff;border:3px solid var(--rotu);font-family:var(--disp);font-weight:800;font-size:22px;color:var(--rotu);margin-bottom:12px;transition:background .2s,color .2s}
.paso .cuando{display:block;font-size:13px;color:var(--gris)}
.paso .app{display:block;font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.01em;margin-top:2px}
.paso button[aria-pressed=true] .num,.paso button:hover .num{background:var(--rotu);color:#fff}
.paso.urg .num{border-color:var(--urg);color:var(--urg)}
.paso.urg button[aria-pressed=true] .num,.paso.urg button:hover .num{background:var(--urg);color:#fff}
.siempre{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 0}
.siempre button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;border:1.5px dashed var(--rotu);border-radius:12px;padding:10px 16px;font-size:15px}
.siempre button b{font-family:var(--disp);font-size:17px}
.siempre button[aria-pressed=true]{background:var(--rotu);color:#fff;border-style:solid}

.ficha{margin-top:34px;display:grid;grid-template-columns:1.2fr 1fr;gap:0;border:1px solid var(--linea);border-radius:20px;overflow:hidden;background:var(--papel);box-shadow:0 20px 50px -30px rgba(91,42,134,.45)}
.ficha .izq{padding:34px 36px}
.ficha .der{padding:34px 32px;background:var(--suave);border-left:1px solid var(--linea)}
.ficha .nombre{font-family:var(--disp);font-weight:800;font-size:clamp(34px,4.4vw,54px);letter-spacing:-.03em;line-height:1;margin:6px 0 10px;color:var(--rotu)}
.ficha.es-urg .nombre{color:var(--urg)}
.ficha .momento{font-size:15px;color:var(--gris);margin:0}
.ficha .que{font-size:19px;margin:16px 0 18px;max-width:46ch}
.ficha ul{margin:0;padding-left:20px}
.ficha li{margin:6px 0}
.ficha h3{font-family:var(--disp);font-size:17px;margin:0 0 8px}
.ficha .bloque+.bloque{margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:4px 12px;margin:0 6px 6px 0}
.chip.sin{background:#DDF1EE;color:#075049}
.chip.con{background:#ECE3F5;color:#4A2070}
.chip.est{background:#fff;border:1px solid var(--linea);color:var(--gris)}
.chip svg{width:14px;height:14px}

/* principios */
.reglas{background:var(--tinta);color:#F4EEF8}
.reglas .h2{color:#fff}
.reglas .lead{color:#CFC4DA}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.regla .grande{font-family:var(--disp);font-weight:800;font-size:clamp(26px,2.6vw,34px);line-height:1.08;letter-spacing:-.02em;margin:0 0 12px;color:#fff}
.regla p{margin:0;color:#D8CEE2;max-width:38ch}
.regla .raya{width:56px;height:4px;border-radius:2px;margin-bottom:20px}

/* complementarias */
.compl{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:16px;overflow:hidden}
.compl a{display:block;background:#fff;padding:22px 22px 24px;text-decoration:none;color:var(--tinta);min-height:150px}
.compl a:hover{background:var(--suave)}
.compl .n{font-family:var(--disp);font-weight:800;font-size:21px;color:var(--rotu);letter-spacing:-.01em}
.compl .g{display:block;font-size:13px;color:var(--gris);margin-top:2px}
.compl p{margin:10px 0 0;font-size:15px;line-height:1.45}
.compl a.dest{grid-column:span 2;background:var(--piel)}
.compl a.dest:hover{background:var(--piel2)}
.compl a.dest .n{font-size:28px}

/* estado y pie */
.estado{background:var(--suave)}
.estado .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.estado ol{margin:0;padding-left:22px}
.estado li{margin:10px 0}
.estado li b{font-family:var(--disp)}
.aviso{border-left:4px solid var(--urg);padding:4px 0 4px 18px;color:#3A3048;max-width:58ch}
footer{padding:44px 0 56px;font-size:15px;color:var(--gris)}
footer .autores{display:flex;flex-wrap:wrap;gap:28px;margin:0 0 18px}
footer .autores b{display:block;color:var(--tinta);font-size:16px}
footer .autores a{font-size:14px}

@media (max-width:980px){
  .hero .wrap{grid-template-columns:1fr;padding-top:36px}
  .cara{max-width:360px}
  .ruta{grid-template-columns:repeat(3,1fr);row-gap:26px}
  .ruta::before{display:none}
  .ficha{grid-template-columns:1fr}
  .ficha .der{border-left:0;border-top:1px solid var(--linea)}
  .tres{grid-template-columns:1fr;gap:34px}
  .compl{grid-template-columns:repeat(2,1fr)}
  .estado .wrap{grid-template-columns:1fr}
}
@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 18px}
  section{padding:60px 0}
  .ruta{grid-template-columns:repeat(2,1fr)}
  .ficha .izq,.ficha .der{padding:24px 22px}
  .compl{grid-template-columns:1fr}
  .compl a.dest{grid-column:auto}
  .langs button{padding:6px 8px}
}
</style>
</head>

  <section id="ruta"><div class="wrap">

let L = 'es', SEL = 'urgencia';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
function pinta() {
  const t = T[L];
  document.documentElement.lang = L; document.title = t.title;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t[el.dataset.tAria]));
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === L));
  $('pasos').innerHTML = PASOS.map((id, i) => { const a = t.apps[id]; return `<li class="paso${a.urg ? ' urg' : ''}"><button type="button" data-app="${id}" aria-pressed="${SEL === id}" aria-controls="ficha"><span class="num">${i + 1}</span>${DISP[id] ? `<span class="chip sin" style="margin:0 0 6px">${esc(t.disp)}</span>` : ''}<span class="cuando">${esc(a.cuando)}</span><span class="app">${esc(a.n)}</span></button></li>`; }).join('');
  $('transv').innerHTML = `<span style="align-self:center;color:var(--gris);font-size:15px">${esc(t.transv)}</span>` + TRANSV.map(id => `<button type="button" data-app="${id}" aria-pressed="${SEL === id}" aria-controls="ficha"><b>${esc(t.apps[id].n)}</b><span>${esc(t.apps[id].cuando)}</span></button>`).join('');
  const a = t.apps[SEL];
  $('ficha').className = 'ficha' + (a.urg ? ' es-urg' : '');
  $('ficha').innerHTML = `<div class="izq"><p class="momento">${esc(t.momento)}: ${esc(a.cuando)}</p><h3 class="nombre">${esc(a.n)}</h3><p class="que">${esc(a.que)}</p>
      <div><span class="chip ${a.ia ? 'con' : 'sin'}">${a.ia ? IC.con : IC.sin}${esc(a.ia ? t.conIA : t.sinIA)}</span>${DISP[SEL] ? `<span class="chip sin">${esc(t.disp)}</span>` : `<span class="chip est">${esc(t.estado)}</span>`}</div>${DISP[SEL] ? `<a class="cta" style="margin-top:18px" href="${DISP[SEL]}" target="_blank" rel="noopener">${esc(t.abrir)} ${esc(a.n)}</a>` : ''}</div>
    <div class="der"><div class="bloque"><h3>${esc(t.hace)}</h3><ul>${a.hace.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="bloque"><h3>${esc(t.comprueba)}</h3><ul>${a.comp.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>`;
  $('tres').innerHTML = t.reglas.map(([c, g, p]) => `<div class="regla"><div class="raya" style="background:${c}"></div><p class="grande">${esc(g)}</p><p>${esc(p)}</p></div>`).join('');
  $('compl').innerHTML = COMPL.map(([id, d]) => { const c = t.compl[id]; return `<a class="${d ? 'dest' : ''}" href="https://fborrasumh.github.io/${id}/" target="_blank" rel="noopener"><span class="n">${esc(c[0])}</span><span class="g">${esc(c[1])}</span><p>${esc(c[2])}</p></a>`; }).join('');
  $('orden').innerHTML = t.orden.map(([a2, b]) => `<li><b>${esc(a2)}</b>: ${esc(b)}</li>`).join('');
  document.querySelectorAll('[data-app]').forEach(b => b.onclick = () => { SEL = b.dataset.app; pinta(); document.querySelector(`[data-app="${SEL}"]`).focus(); });
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => { L = b.dataset.lang; try { localStorage.setItem('kitesteticia_lang', L); } catch (e) {} pinta(); });
try { const g = localStorage.getItem('kitesteticia_lang'); if (T[g]) L = g; } catch (e) {}
pinta();
</script>
